# Laboratorio local y deliberadamente vulnerable.
# Aislamiento: solo loopback, red dedicada, rootfs de solo lectura,
# sin capabilities nuevas, límites de memoria/PIDs y tmpfs acotados.
# NO exponer este stack fuera de localhost / red de laboratorio.
name: php2shell-lab

services:
  php:
    # 8.5.11 = vulnerable. Cambia a 8.5.12 para la comprobación "parcheado".
    image: ${LAB_PHP_IMAGE:-php:8.5.11-fpm}
    volumes:
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-php2shell-lab.ini:ro
      - ./php/www.conf:/usr/local/etc/php-fpm.d/zz-php2shell-lab.conf:ro
      - ./www:/var/www/html:ro
    # Sin puertos publicados: solo nginx habla con FPM.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    mem_limit: 256m
    pids_limit: 128
    networks:
      - labnet

  target:
    # App de entrenamiento DELIBERADAMENTE vulnerable (subida -> webshell).
    # Es el objetivo de la fase final de RCE; no forma parte del CVE de memoria.
    # No exponer fuera de loopback.
    image: php:8.5.11-apache
    ports:
      - "127.0.0.1:${LAB_TARGET_PORT:-8082}:80"
    volumes:
      - ./target/www:/var/www/html:ro
      - ./target/flag.txt:/flag.txt:ro
      - ./target/apache-vuln.conf:/etc/apache2/conf-enabled/zz-vuln.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/run/apache2:size=1m
      - /var/lock/apache2:size=1m
      - /var/www/html/uploads:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 64
    networks:
      - labnet

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${LAB_PORT:-8080}:80"   # solo loopback; LAB_PORT permite evitar colisiones
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      - php
    networks:
      - labnet

networks:
  labnet:
    driver: bridge

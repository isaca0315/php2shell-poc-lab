# Variante PARCHEADA (8.5.12) para comparar el mismo trigger.
# Se levanta en paralelo, en el puerto 8081 y con su propia red/proyecto:
#   docker compose -f docker-compose.fixed.yml up -d
#   python3 trigger.py --url http://127.0.0.1:8081/ --mode progress
name: php2shell-lab-fixed

services:
  php:
    image: php:8.5.12-fpm
    volumes:
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-php2shell-lab.ini:ro
      - ./php/www.conf:/usr/local/etc/php-fpm.d/zz-php2shell-lab.conf:ro
      - ./www:/var/www/html:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    mem_limit: 256m
    pids_limit: 128
    networks:
      - labnet

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      - php
    networks:
      - labnet

networks:
  labnet:
    driver: bridge

; Configuración del laboratorio: límites pequeños para provocar el fallo
; de asignación DENTRO del handler de session.upload_progress.
[PHP]
memory_limit = 4M
post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 2000

; Superficie vulnerable (habilitada por defecto en PHP afectados).
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.freq = 1
session.upload_progress.min_freq = 0
session.save_path = /tmp
session.use_strict_mode = 0

; Logs: los errores van al stderr del contenedor (docker compose logs php).
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
